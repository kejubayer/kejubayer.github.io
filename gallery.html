<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Khondoker Eftakhar Jubayer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body { background: #f8fafc; }
      .gallery-card {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
      }
      .gallery-img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        cursor: zoom-in;
        transition: transform 0.25s ease;
      }
      .gallery-img:hover { transform: scale(1.03); }
      .gallery-caption {
        font-size: 0.82rem;
        color: #64748b;
        padding: 0.65rem 0.8rem 0.8rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html#home">← Back Home</a>
      </div>
    </nav>

    <main class="py-5">
      <div class="container">
        <h1 class="h3 text-center mb-4">All Gallery Photos</h1>
        <div id="galleryGrid" class="row g-4"></div>
        <p id="galleryFallback" class="text-center text-muted mt-3 d-none">No gallery images found.</p>
      </div>
    </main>

    <div class="modal fade" id="zoomModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-dark">
          <div class="modal-body p-0">
            <img id="zoomImage" src="" alt="Zoomed gallery image" class="img-fluid w-100" />
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/gallery.js"></script>
    <script>

      function openZoom(src, altText) {
        document.getElementById("zoomImage").src = src;
        document.getElementById("zoomImage").alt = `Zoomed ${altText}`;
        bootstrap.Modal.getOrCreateInstance(document.getElementById("zoomModal")).show();
      }

      async function renderGallery() {
        const grid = document.getElementById("galleryGrid");
        const fallbackText = document.getElementById("galleryFallback");
        const images = await getGalleryImages();

        if (!images.length) {
          fallbackText.classList.remove("d-none");
          return;
        }

        grid.innerHTML = images
          .map((src, index) => {
            const fileName = src.split("/").pop().replace(/\.[^/.]+$/, "");
            const altText = `Khondoker Eftakhar Jubayer gallery image ${index + 1} ${fileName}`;
            return `
              <div class="col-sm-6 col-lg-4">
                <figure class="gallery-card mb-0">
                  <img src="${src}" class="gallery-img" alt="${altText}" title="${altText}" loading="lazy" onclick="openZoom('${src}', '${altText}')" />
                  <figcaption class="gallery-caption">${altText}</figcaption>
                </figure>
              </div>
            `;
          })
          .join("");
      }

      renderGallery();
    </script>
  </body>
</html>
